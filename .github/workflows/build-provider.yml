name: Build LabCPFProvider x64 v7 API

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Prepare source
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\credential-provider\scripts\prepare-source.ps1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: powershell
        run: |
          msbuild .\credential-provider\generated\SampleV2CredentialProvider.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143

      - name: Validate generated source
        shell: powershell
        run: |
          $cred = Get-Content .\credential-provider\generated\CSampleCredential.cpp -Raw
          $api  = Get-Content .\credential-provider\generated\LabApi.cpp -Raw

          if (-not $cred.Contains("LabAuthorizeCpf(normalizedCpf)")) {
            throw "Integracao API ausente."
          }

          if ($cred.Contains('wcscmp(normalizedCpf, L"12345678909")')) {
            throw "Ainda existe CPF fixo no Credential Provider."
          }

          if (-not $api.Contains("WinHttpSendRequest")) {
            throw "Cliente WinHTTP ausente."
          }

      - name: Collect artifact
        shell: powershell
        run: |
          $dll = Get-ChildItem .\credential-provider\generated -Recurse -Filter "SampleV2CredentialProvider.dll" |
                 Sort-Object LastWriteTime -Descending |
                 Select-Object -First 1

          if (-not $dll) {
            throw "DLL nao encontrada."
          }

          New-Item -ItemType Directory -Force .\artifact | Out-Null
          Copy-Item $dll.FullName .\artifact\LabCPFProvider.dll -Force
          Copy-Item .\credential-provider\installer\* .\artifact\ -Recurse -Force
          Copy-Item .\README.md .\artifact\README.md -Force

          $hash = (Get-FileHash .\artifact\LabCPFProvider.dll -Algorithm SHA256).Hash.ToLower()
          "$hash  LabCPFProvider.dll" | Set-Content .\artifact\SHA256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabCPFProvider-x64-v7-API
          path: artifact/
          if-no-files-found: error
          retention-days: 30
