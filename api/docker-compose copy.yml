################################################## WAHA #################################################

#
# WAHA - WhatsApp API
#

  waha:
    container_name: Waha-WhatsAppAPI

    image: devlikeapro/waha:latest

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "${DOCKER_PATH:?DOCKER_PATH nao definido}/WAHA/sessions:/app/.sessions"
      - "${DOCKER_PATH:?DOCKER_PATH nao definido}/WAHA/ssh:/root/.ssh"
      - "${DOCKER_PATH:?DOCKER_PATH nao definido}/WAHA/scripts/webhook-squid.js:/app/webhook-squid.js:ro"

    environment:

      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_LOG_LEVEL: info

      WAHA_API_KEY: "${WAHA_API_KEY}"
      WAHA_DASHBOARD_USERNAME: "${WAHA_DASHBOARD_USERNAME}"
      WAHA_DASHBOARD_PASSWORD: "${WAHA_DASHBOARD_PASSWORD}"
      WHATSAPP_SWAGGER_USERNAME: "${WHATSAPP_SWAGGER_USERNAME}"
      WHATSAPP_SWAGGER_PASSWORD: "${WHATSAPP_SWAGGER_PASSWORD}"

      WHATSAPP_HOOK_URL: "${WAHA_WEBHOOK_URL}"
      WHATSAPP_HOOK_EVENTS: "message"
      
      WHATSAPP_START_SESSION: "default"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"

      WHATSAPP_API_PORT: "3002"
      PORT: "3002"

      WAHA_HOST: "127.0.0.1"
      WAHA_INTERNAL_PORT: "3002"
      WAHA_PROXY_PORT: "3000"

      SESSION: "default"

      SSH_HOST: "${SQUID_SSH_HOST}"
      SSH_USER: "${SQUID_SSH_USER}"
      SERVICE: "${SQUID_SERVICE}"

      WEBHOOK_URL: "${WAHA_WEBHOOK_URL}"
      ALLOWED: "${SQUID_ALLOWED_NUMBERS}"

    ports:
      - "3010:3000"

    mem_limit: 1g
    memswap_limit: 1g

    networks:
      - monitoramento
      
    command: >
      sh -c "
        apt update &&
        apt install -y openssh-client &&
        mkdir -p /root/.ssh &&
        chmod 700 /root/.ssh &&
        touch /root/.ssh/known_hosts &&
        ssh-keygen -R ${SQUID_SSH_HOST} -f /root/.ssh/known_hosts >/dev/null 2>&1 || true &&
        ssh-keyscan -H ${SQUID_SSH_HOST} >> /root/.ssh/known_hosts 2>/dev/null &&
        chmod 600 /root/.ssh/known_hosts &&
        node /app/webhook-squid.js &
        npm run start:prod
      "

    restart:
      always

#
# cAdvisor
#

  cadvisor:
    container_name: cAdvisor
    image: gcr.io/cadvisor/cadvisor:v0.52.1

    privileged: true

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"

      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
