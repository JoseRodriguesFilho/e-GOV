#version: "3.9"

services:
  
################################################## CONTAINERS ##################################################

#
# Portainer
#

  portainer:
    container_name: Portainer
    image: portainer/portainer-ce:2.20.2
    command: -H unix:///var/run/docker.sock
    
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      
      - "${DOCKER_PATH}/Portainer/data:/data"
      - "${DOCKER_PATH}/Proxy/ssl/:/certs"
            
    expose:
      - "9000"
      
    networks:
      - portainer
      
    restart: always

########################################### Reverse Proxy ###########################################

#     
# Nginx Reverse Proxy
#      
      
  proxy:
    container_name: Reverse-Proxy
    # Versao () 
    image: jc21/nginx-proxy-manager:latest
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
      
      - "${DOCKER_PATH}/Proxy/ssl:/custom-ssl"
      - "${DOCKER_PATH}/Proxy/data:/data"
      - "${DOCKER_PATH}/Proxy/letsencrypt:/etc/letsencrypt"

    ports:
      - "80:80"
      - "443:443"
      
    expose:  
      - "81"

    networks:
      - portainer
      - reverseproxy
      - unifi
      - monitoramento
      - stirling-pdf
      - automacao
      - dhcp
      - sga
      - e-sus
      - cracha
      - termos
      - ipam
      - hotspot
      - passbolt
      - atestes
      - agenda-veicular

#   "no", always, on-failure, unless-stopped      
    restart:
      always 

################################################## PostgreSQL #################################################

#
# PostgreSQL
#

  postgresql:
    container_name: PostgreSQL
    image: postgres:16-alpine
    
    cpus: 1.0
    mem_limit: 2g

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"

      - "${DOCKER_PATH}/PostgreSQL/data:/var/lib/postgresql/data"

    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    ports:
      - "15432:5432"

    networks:
      - atestes
      - agenda-veicular

#   "no", always, on-failure, unless-stopped
    restart: always

################################################## Iperf3 #################################################

#
# Iperf3 - Network Performance Test
#

  iperf3:
    container_name: Iperf3
    image: networkstatic/iperf3

    command: -s

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"

    ports:
      - "5201:5201"

    networks:
      - monitoramento

    restart: always

################################################## FreeRADIUS ##################################################

#
# FreeRADIUS
#

  freeradius:
   container_name: FreeRADIUS

   image: freeradius/freeradius-server:3.2.10 #3.2.7

   volumes:

     - "/etc/localtime:/etc/localtime:ro"
     - "/etc/timezone:/etc/timezone:ro"
     - "${DOCKER_PATH}/Freeradius/clients.conf:/etc/freeradius/clients.conf:ro"
     - "${DOCKER_PATH}/Freeradius/sql:/etc/freeradius/mods-enabled/sql:ro"
     - "${DOCKER_PATH}/Freeradius/default:/etc/freeradius/sites-enabled/default:ro"

   environment:
     TZ: "America/Sao_Paulo"

   command: ["freeradius", "-X"]

   ports:
     - "1812:1812/udp"
     - "1813:1813/udp"

   networks:
     - freeradius

   restart:
     always

################################################## UNIFI #################################################

#
# Unifi
#

  unifi:
    container_name: UNIFI
    # Versao ()
    image: jacobalberty/unifi:v9.5.21 #v8.5.6 #v8.0.26 #v6.5.55 #5.11.50

    labels:
      - "unifi-controller"     

    volumes:

      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
      
      - "${DOCKER_PATH}/UNIFI/lib/:/var/lib/unifi"
      - "${DOCKER_PATH}/UNIFI/log/:/var/log/unifi"
      - "${DOCKER_PATH}/UNIFI/run/:/var/run/unifi"

    environment:
    
      - TZ=America/Sao_Paulo
   
    ports:
      - "3478:3478/udp"
      - "10001:10001/udp"
      - "6789:6789/tcp"
      - "8080:8080/tcp"
      - "8843:8843/tcp"

    networks:
      - unifi

#   "no", always, on-failure, unless-stopped      
    restart:
      always

################################################## Monitoramento ##################################################

#
# Zabbix-Mysql
#

  zabbix_mysql:
    container_name: Zabbix-Mysql
    image: mysql:8.4
    
    mem_limit: "4608m"  

    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --log-bin-trust-function-creators=1
      - --innodb-buffer-pool-size=3G

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
      - "/usr/share/zoneinfo:/usr/share/zoneinfo:ro"
      - "${DOCKER_PATH}/Zabbix/mysql/data:/var/lib/mysql"

    environment:
      MYSQL_DATABASE: "${ZABBIX_MYSQL_DATABASE}"
      MYSQL_USER: "${ZABBIX_MYSQL_USER}"
      MYSQL_PASSWORD: "${ZABBIX_MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${ZABBIX_MYSQL_ROOT_PASSWORD}"

    networks:
      - monitoramento

    restart: unless-stopped

#
# Zabbix-Server
#

  zabbix_server:
    container_name: Zabbix-Server
    image: zabbix/zabbix-server-mysql:alpine-7.4.13
    
    mem_limit: "2560m"

    depends_on:
      zabbix_mysql:
        condition: service_healthy

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"

      - "${DOCKER_PATH}/Zabbix/scripts:/etc/zabbix/scripts/"
      - "${DOCKER_PATH}/Zabbix/alertscripts:/usr/lib/zabbix/alertscripts/"

    environment:
      DB_SERVER_HOST: "Zabbix-Mysql"
      DB_SERVER_PORT: "${ZABBIX_DB_SERVER_PORT}"

      MYSQL_DATABASE: "${ZABBIX_MYSQL_DATABASE}"
      MYSQL_USER: "${ZABBIX_MYSQL_USER}"
      MYSQL_PASSWORD: "${ZABBIX_MYSQL_PASSWORD}"

      ZBX_DEBUGLEVEL: "3"

      ZBX_CACHESIZE: "512M"
      ZBX_HISTORYCACHESIZE: "256M"
      ZBX_HISTORYINDEXCACHESIZE: "128M"
      ZBX_TRENDCACHESIZE: "128M"
      ZBX_VALUECACHESIZE: "256M"
      
      ZBX_ENABLE_SNMP_TRAPS: "true"

      ZBX_STARTPOLLERS: "20"
      ZBX_STARTLLDPROCESSORS: "5"
      ZBX_STARTDBSYNCERS: "6"
      ZBX_STARTHISTORYWRITERS: "8"
      ZBX_STARTPOLLERSUNREACHABLE: "10"
      ZBX_STARTPINGERS: "20"
      ZBX_STARTVMWARECOLLECTORS: "5"
      ZBX_STARTHTTPPOLLERS: "10"
      ZBX_STARTSNMPTRAPPER: "1"

    ports:
      - "10051:10051"

    networks:
      - monitoramento

    restart: always

#
# Zabbix-Agent
#

  zabbix_agent:
    container_name: Zabbix-Agent
    image: zabbix/zabbix-agent:alpine-7.4.13
    
    mem_limit: "1024m"

    depends_on:
      zabbix_server:
        condition: service_started

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"

    environment:
      ZBX_HOSTNAME: "Zabbix-Agent"
      ZBX_SERVER_HOST: "Zabbix-Server"
      ZBX_DEBUGLEVEL: "3"

    networks:
      - monitoramento

    restart: always

#
# Zabbix-Web
#

  zabbix_web:
    container_name: Zabbix-Web
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.4.13
    
    mem_limit: "1024m"

    depends_on:
      zabbix_mysql:
        condition: service_healthy
      zabbix_server:
        condition: service_started

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"

      - "${DOCKER_PATH}/Proxy/ssl/francodarocha.sp.gov.br.crt:/etc/ssl/nginx/server.crt:ro"
      - "${DOCKER_PATH}/Proxy/ssl/francodarocha.sp.gov.br.key:/etc/ssl/nginx/server.key:ro"

    environment:
      DB_SERVER_HOST: "Zabbix-Mysql"
      DB_SERVER_PORT: "${ZABBIX_DB_SERVER_PORT}"

      MYSQL_DATABASE: "${ZABBIX_MYSQL_DATABASE}"
      MYSQL_USER: "${ZABBIX_MYSQL_USER}"
      MYSQL_PASSWORD: "${ZABBIX_MYSQL_PASSWORD}"

      ZBX_SERVER_HOST: "Zabbix-Server"
      ZBX_SERVER_NAME: "PMFR | Diretoria de T.I"

      PHP_TZ: "America/Sao_Paulo"

      ZBX_ENABLE_SSL: "true"
      ZBX_SSL_CERT_FILE: "/etc/ssl/nginx/server.crt"
      ZBX_SSL_KEY_FILE: "/etc/ssl/nginx/server.key"

    ports:
      - "8888:8080"
      - "8443:8443"

    networks:
      - monitoramento

    restart: always

#
# Zabbix-Proxy
#

  zabbix_proxy:
    container_name: Zabbix-Proxy
    # Versao () 
    image: zabbix/zabbix-proxy-sqlite3:alpine-7.0.12

    volumes:

      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro" 
      - "${DOCKER_PATH}/Zabbix/scripts/zabbix_proxy.psk:/var/lib/zabbix/enc/zabbix_proxy.psk" 

    environment:

      ZBX_HOSTNAME: "Zabbix-Proxy"
      ZBX_SERVER_HOST: "Zabbix-Server"
      ZBX_SERVER_PORT: "10051" # Zabbix Server Port (10051 is assumed if not provided)
      ZBX_TLSACCEPT: "psk"
      ZBX_TLSPSKIDENTITY: "ZBX-PSK-DOCKER"
      ZBX_TLSPSKFILE: "/var/lib/zabbix/enc/zabbix_proxy.psk"  
      ZBX_TLSCONNECT: "psk"

    ports:
      - "10061:10051"

    networks:
      - monitoramento
#   "no", always, on-failure, unless-stopped      
    restart:
      always

#
# Grafana
#

  grafana:
    container_name: Grafana
    image: grafana/grafana
    user: "root"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
      
      - "${DOCKER_PATH}/Grafana/data:/var/lib/grafana"
      - "${DOCKER_PATH}/Grafana/ldap.toml:/etc/grafana/ldap.toml"
      
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"
      GF_INSTALL_PLUGINS: "camptocamp-prometheus-alertmanager-datasource,grafana-clock-panel,briangann-gauge-panel,alexanderzobnin-zabbix-app,grafana-polystat-panel,vonage-status-panel,grafana-piechart-panel,mtanda-histogram-panel,yesoreyeram-boomtable-panel,briangann-datatable-panel,grafana-simple-json-datasource,yesoreyeram-infinity-datasource,grafana-mqtt-datasource,agenty-flowcharting-panel,grafana-worldmap-panel,marcusolsson-json-datasource"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: "alexanderzobnin-zabbix-datasource"
      GF_SERVER_PROTOCOL: "http"
      GF_SERVER_HTTP_PORT: "3000"
      GF_PANELS_ENABLE_ALPHA: "true"
      GF_AUTH_LDAP_ENABLED: "true"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${GF_SMTP_HOST}"
      GF_SMTP_USER: "${GF_SMTP_USER}"
      GF_SMTP_PASSWORD: "${GF_SMTP_PASSWORD}"
      GF_AUTH_TOKEN_ROTATION_INTERVAL_MINUTES: "3600"
      GF_RENDERING_SERVER_URL: "http://Grafana-Render:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://Grafana:3000/"
      GF_LOG_FILTERS: "rendering:debug"
      
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      
    expose:
      - "3000"
    networks:
      - monitoramento
    restart: always

#
# Grafana-Render
#

  grafana_render:
    container_name: Grafana-Render
    # Versao () 
    image: grafana/grafana-image-renderer:latest
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro" 

    environment:
      ENABLE_METRICS: "true" 

    expose:
      - "8081"

    networks:
      - monitoramento
#   "no", always, on-failure, unless-stopped      
    restart:
      always

#
# Prometheus
#

  prometheus:
    container_name: Prometheus
    # Versao () 
    image: prom/prometheus

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
      
      - "${DOCKER_PATH}/Prometheus/data:/etc/prometheus"
 
    ports:
      - "9090"

    networks:
      - monitoramento
#   "no", always, on-failure, unless-stopped      
    restart:
      always

#
# Alert Manager
#

  alertmanager:
    container_name: Alertmanager
    # Versao () 
    image: bitnami/alertmanager:latest

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro" 
      
      - "${DOCKER_PATH}/Prometheus/data/alertmanager/config.yml:/opt/bitnami/alertmanager/conf/config.yml"
               
    ports:
      - "9093"

    networks:
      - monitoramento
#   "no", always, on-failure, unless-stopped      
    restart:
      always

#
# Blackbox Exporter
#

  blackbox_exporter:
    container_name: Blackbox-Exporter
    # Versao () 
    image: prom/blackbox-exporter:master

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
      
#      - "${DOCKER_PATH}/Prometheus/data/blackbox/blackbox.yml:/config.yml"

    environment:
      - "--config.file=/config/blackbox.yml"
      
    ports:
      - "9115:9115"

    networks:
      - monitoramento
#   "no", always, on-failure, unless-stopped      
    restart:
      always 

#
# SNMP Exporter
#

  snmp_exporter:
    container_name: SNMP-Exporter
    #
    image: quay.io/prometheus/snmp-exporter

    command: --config.file=/etc/snmp_exporter/snmp.yml

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"

      - "${DOCKER_PATH}/Prometheus/data/snmp-exporter:/etc/snmp_exporter"

    ports:
     - "9116:9116"
     - "116:116/udp"

    networks:
      - monitoramento
#   "no", always, on-failure, unless-stopped      
    restart:
      always

#
# Speedtest
#

  speedtest:
    container_name: Speedtest
    # Versao () 
    image: jraviles/prometheus_speedtest:latest

    volumes:

      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro" 

    expose:
      - "9516"

    networks:
      - monitoramento
#   "no", always, on-failure, unless-stopped      
    restart:
      always      

#
# Mosquitto MQTT Broker
#

  mosquitto:
    container_name: MQTT
    # Versao (1.6.10) 
    image: eclipse-mosquitto:2.0.15

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro" 

      - "${DOCKER_PATH}/MQTT:/mosquito"
      - "${DOCKER_PATH}/MQTT/mosquitto.conf:/mosquitto/config/mosquitto.conf" # Default config mosquito.conf
      - "${DOCKER_PATH}/MQTT/password.txt:/mosquitto/config/password.txt" #

    ports:
      - "1883:1883"
      - "9001:9001"
      - "8883:8883"
      - "1884:1884"
      - "8000:8000"

    networks:
      - monitoramento
#   "no", always, on-failure, unless-stopped      
    restart:
      always  

################################################## Zabbix C.O.I Dashboard ###############################################

#
# Zabbix C.O.I Dashboard
#

  zabbix_dashboard_coi:
    container_name: Zabbix-Dashboard-COI
    image: zabbix-dashboard-coi

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"

    environment:
      ZABBIX_URL: "${ZABBIX_DASHBOARD_URL}"
      ZABBIX_TOKEN: "${ZABBIX_DASHBOARD_TOKEN}"
      ZABBIX_GROUP_IDS: "${ZABBIX_DASHBOARD_GROUP_IDS}"
      ZABBIX_GROUP_ID: "${ZABBIX_DASHBOARD_GROUP_ID}"
      REFRESH_SECONDS: "70"
      POLL_SECONDS: "60"
      DOWNTIME_LOOKBACK_HOURS: "168"
      PORT: "6145"
      LOG_LEVEL: "INFO"

    build: ./containers/C.O.I

    expose:
      - "6145"

    networks:
      - monitoramento

#   "no", always, on-failure, unless-stopped
    restart:
      always

################################################## OpenSpeedTest ##################################################

#
# OpenSpeedTest
#

  openspeedtest:
    container_name: Open-SpeedTest
    image: openspeedtest/latest
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
    environment:
      SET_SERVER_NAME: "PMFR - Diretoria de T.I"
    expose:
      - "3001"
      - "3000"
    networks:
      - monitoramento

    restart: always

################################################## Stirling-PDF ##################################################

#     
# Stirling-PDF
#      

################################################## CI/CD ##################################################

# docker exec Jenkins cat /var/jenkins_home/secrets/initialAdminPassword
# chown -R 1000:1000 /opt/docker/containers/Jenkins
# 81882c9a88a34fe9ba09d39e7c71e0f0

#     
# Jenkins
#      
      
  jenkins:
    container_name: Jenkins
    # Versao () 
    image: jenkins/jenkins:lts
#    privileged: true
#    user: root

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      
      - "${DOCKER_PATH}/Jenkins:/var/jenkins_home"

    expose:
      - "8080"
      - "50000"

    networks:
      - automacao
#   "no", always, on-failure, unless-stopped      
    restart:
      always

################################################## FTP ##################################################

#     
# FTP
#      
      
  ftp:
    container_name: FTP
    # Versao () 
    image: fauria/vsftpd

    volumes:

      - "${DOCKER_PATH}/Stirling-PDF:/home/vsftpd:rw"

    ports:
     - "21:21"

    environment:
    
      FTP_USER: "${FTP_USER}"
      FTP_PASS: "${FTP_PASS}"
      PASV_ADDRESS: "${FTP_PASV_ADDRESS}"
      PASV_MIN_PORT: 21000
      PASV_MAX_PORT: 21010
      FILE_OPEN_MODE: "0666"
      LOCAL_UMASK: "022"
      LOG_STDOUT: "YES"
       
    networks:
      - stirling-pdf
#   "no", always, on-failure, unless-stopped      
    restart:
      always

################################################## KEA ##################################################

#     
# KEA
#      
      
  kea:
    container_name: Gerenciador-KEA
    # Versao () 
    image: kea

    volumes:

      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
      
      - "${DOCKER_PATH}/KEA/LOGs/auth.log:/var/www/html/Logs/auth.log"
      - "${DOCKER_PATH}/KEA/Backups:/home"

    environment:
    
      KEA_DATABASE_HOST: "${KEA_DATABASE_HOST}"
      KEA_DATABASE_PORT: "${KEA_DATABASE_PORT}" 
      KEA_DATABASE_USER: "${KEA_DATABASE_USER}" 
      KEA_DATABASE_PASSWORD: "${KEA_DATABASE_PASSWORD}" 
      KEA_DATABASE_NAME: "${KEA_DATABASE_NAME}"
      KEA_COMPANY_NAME_ONLY: "${KEA_COMPANY_NAME_ONLY}"
      KEA_COMPANY_LOGO: "img/logo.png" # Default is "img/logo.png"
      KEA_COMPANY_LOGO_INDEX: "img/pmfr-logo.png" # Default is "img/pmfr-logo.png"
      KEA_LOG_ADMIN_USERS: "${KEA_LOG_ADMIN_USERS}" # Usuários com acesso ao log (separados por vírgula)

    build: ./containers/KEA/Gerenciador

    expose:
      - "80"

    networks:
      - dhcp
#   "no", always, on-failure, unless-stopped      
    restart:
      always

#     
# Mysql Gerenciador-KEA
#      
      
  mysql_kea:
    container_name: MySQL-KEA
    # Versao (5.7) 
    image: mysql:5.7

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
    
      - "${DOCKER_PATH}/KEA/BD/data:/var/lib/mysql"

    environment:
 
      KEA_MYSQL_ROOT_PASSWORD: "${KEA_DATABASE_PASSWORD}"
      KEA_MYSQL_DATABASE: "${KEA_DATABASE_NAME}"
 
      ## Não alterar para expose, o servidor KEA acessa externamente 
    ports:
      - "3309:3306"

    networks:
      - dhcp
      - freeradius  
     
#   "no", always, on-failure, unless-stopped      
    restart:
      always

################################################ Evolution API ##########################################

#
# Evolution API
#

  evolution-postgres:
   container_name: Evolution-Postgres
   image: postgres:16

   volumes:
     - "/etc/localtime:/etc/localtime:ro"
     - "/etc/timezone:/etc/timezone:ro"
     - "${DOCKER_PATH}/Evolution/postgres/data:/var/lib/postgresql/data"

   environment:
     POSTGRES_DB: "evolution"
     POSTGRES_USER: "evolution"
     POSTGRES_PASSWORD: "evolution123"

   networks:
     - monitoramento

   restart:
     always

  evolution-redis:
   container_name: Evolution-Redis
   image: redis:7-alpine

   command: redis-server --appendonly yes

   volumes:
     - "/etc/localtime:/etc/localtime:ro"
     - "/etc/timezone:/etc/timezone:ro"
     - "${DOCKER_PATH}/Evolution/redis/data:/data"

   networks:
     - monitoramento

   restart:
     always

  evolution-api:
   container_name: Evolution-API
   image: evoapicloud/evolution-api:2.4.0-rc2

   depends_on:
     - evolution-postgres
