    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DOCKER_PATH}/Frigate/config:/config
      - /mnt/cameras:/media/frigate

    ports:
      - "8971:8971"
      - "8554:8554" # RTSP feeds
#      - "5000:5000" # Internal unauthenticated access. Expose carefully.
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp

    environment:
      TZ: America/Sao_Paulo

    networks:
      - monitoramento

    restart: always

################################################## Teleport ##################################################

#
# Teleport
#

  teleport:
    container_name: Teleport
    hostname: teleport
    image: public.ecr.aws/gravitational/teleport-distroless:18.10.0

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "${DOCKER_PATH}/Teleport/config:/etc/teleport"
      - "${DOCKER_PATH}/Teleport/data:/var/lib/teleport"

    expose:
      - "3080"

    networks:
      - monitoramento

    restart:
      always

################################################## Lab CPF API ##################################################

#
# API de autorizacao de CPF do Credential Provider
#

  lab-cpf-api:
    container_name: Lab-CPF-API
    # Versao (7.0.0)
    image: lab-cpf-api

    build:
      context: ./containers/LabCPFProvider

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"

      - "${DOCKER_PATH}/LabCPFProvider/data:/data"

    environment:
      TZ: "America/Sao_Paulo"
      LAB_DB_PATH: "/data/labcpf.db"
      LAB_API_TOKEN: "${LAB_API_TOKEN}"
      LAB_ADMIN_TOKEN: "${LAB_ADMIN_TOKEN}"
      LAB_SEED_CPF: "${LAB_SEED_CPF:-12345678909}"
      LAB_SEED_NAME: "${LAB_SEED_NAME:-Aluno Teste}"

    expose:
      - "8088"

    networks:
      - reverseproxy

#   "no", always, on-failure, unless-stopped
    restart:
      always

